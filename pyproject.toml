[project]
name = "roborock-mcp"
version = "0.1.0"
description = "MCP server for controlling a Roborock vacuum with Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "python-roborock>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
